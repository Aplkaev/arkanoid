<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bootstrap.css">
    <link rel="stylesheet" href="index.css">
    <title>Арканоид</title>
</head>
<body>

<div class="w-50 back_to_menu d-none">
    <button class="btn btn-dark">Назад в меню</button>
</div>

<div id="map">
    <!-- УБРАЛ d-none - меню должно быть видно при старте -->
    <menu class="game_menu">
        <ul class="nav flex-column">
            <li class="nav-item">
                <button class="btn btn-info game_2_player">Два игрока: выкл</button>
            </li>
            <li class="nav-item">
                <label>Сложность (1–10)</label>
                <br>
                <input type="number" placeholder="Сложность" class="form-check-input game_level" value="5" min="1" max="10">
            </li>
            <li class="nav-item border-0">
                <button class="btn btn-success game_start">Начать</button>
            </li>
        </ul>
    </menu>
    
    <!-- ДОБАВИЛ d-none - экраны победы/поражения скрыты -->
    <section class="game_win d-none">
        <h1>Поздравляю</h1>
        <button class="btn btn-success" id="button_game_restart_win">Начать сначала</button>
    </section>
    
    <section class="game_fail d-none">
        <h1>Игра окончена</h1>
        <button class="btn btn-success" id="button_game_restart_fail">Начать сначала</button>
    </section>
    
    <canvas id="game"></canvas>
</div>

<div class="game_state">
    <div>
        Жизни:
        <span class="game_health"></span>
    </div>
    <div>
        Очки:
        <span class="game_score"></span>
    </div>
</div>

<script src="objects/config.js"></script>
<script src="objects/ParentObject.js"></script>
<script src="objects/Stick.js"></script>
<script src="objects/Position.js"></script>
<script src="objects/Boll.js"></script>
<script src="objects/Enemy.js"></script>
<script src="objects/Player.js"></script>
<script src="game.js"></script>
<script src="index.js"></script>

</body>
</html>
